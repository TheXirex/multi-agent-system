services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-service
    restart: unless-stopped
    command: ["python", "-m", "agents.service"]
    environment:
      HOST: "0.0.0.0"
      PORT: "8001"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: app_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      LLM_API_KEY: ${LLM_API_KEY}
    ports:
      - "8001:8001"
    volumes:
      - ./agents:/app/agents
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-service
    restart: unless-stopped
    command: ["python", "-m", "backend"]
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: app_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      AI_SERVICE_URL: http://ai:8001
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    command: ["python", "-m", "ui.app"]
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:8080"
    volumes:
      - ./ui:/app/ui
    depends_on:
      - backend

volumes:
  pgdata:
