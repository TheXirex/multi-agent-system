version: '1.0'
metadata:
  suite_name: Evaluation
  dataset_name: eval_dataset
  target_url: http://localhost:8000
  langfuse_host: http://localhost:3000
scenarios:
- id: onboarding
  title: Onboarding & Direct
  description: Conversational answers, capabilities, schema exploration, and safe
    guardrails.
  turns:
  - turn_id: 1
    user_query: Hello! Who are you and what can you do?
    expected_route: direct
    expected_tools: []
    expected_metadata_keys: []
    assertions:
    - type: not_empty
    - type: no_sql
  - turn_id: 2
    user_query: What capabilities do you support?
    expected_route: direct
    expected_tools: []
    expected_metadata_keys: []
    assertions:
    - type: not_empty
    - type: no_sql
  - turn_id: 3
    user_query: What tables are in the database?
    expected_route: tools
    expected_tools:
    - get_database_schema
    expected_metadata_keys:
    - schema_tables
    assertions:
    - type: contains_tables
      tables:
      - categories
      - orders
      - product_reviews
      - products
      - users
    - type: forbidden_phrases
      phrases:
      - public schema
      - information_schema
  - turn_id: 4
    user_query: Explain the difference between linear regression and random forest.
    expected_route: direct
    expected_tools: []
    expected_metadata_keys: []
    assertions:
    - type: not_empty
    - type: no_sql
  - turn_id: 5
    user_query: Write a recipe for pepperoni pizza.
    expected_route: refusal
    expected_tools: []
    expected_metadata_keys:
    - guardrail_triggered
    assertions:
    - type: refusal_polite
- id: sql_analytics
  title: SQL Analytics
  description: Progressive investigation of high-value catalog items, customer orders,
    and reviews.
  turns:
  - turn_id: 1
    user_query: Show top 5 most expensive products.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    expected_metadata_keys:
    - sql_query
    - sql_script_id
    - table_name
    assertions:
    - type: sql_syntax_valid
    - type: target_table
      name: products
  - turn_id: 2
    user_query: Show 10 orders with product and customer names.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    expected_metadata_keys:
    - sql_query
    - sql_script_id
    - table_names
    assertions:
    - type: sql_contains_join
  - turn_id: 3
    user_query: How many reviews have a 5-star rating?
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    expected_metadata_keys:
    - sql_query
    - sql_script_id
    - table_name
    assertions:
    - type: sql_syntax_valid
- id: ml_analysis
  title: ML Analysis
  description: 'End-to-end data science workflow: EDA, feature correlation, segmentation,
    rating prediction, and sales dynamics.'
  turns:
  - turn_id: 1
    user_query: Visualize discount percentage distribution.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    - run_ml_analysis
    expected_metadata_keys:
    - chart_id
    - python_script_id
    assertions:
    - type: chart_generated
  - turn_id: 2
    user_query: Show price vs rating correlation.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    - run_ml_analysis
    expected_metadata_keys:
    - chart_id
    - python_script_id
    assertions:
    - type: chart_generated
  - turn_id: 3
    user_query: Segment products into 3 clusters and visualize them.
    expected_route: tools
    expected_tools:
    - run_ml_analysis
    expected_metadata_keys:
    - chart_id
    - python_script_id
    assertions:
    - type: chart_generated
  - turn_id: 4
    user_query: Train a regression model to predict ratings and show R2 and MAE.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    - run_ml_analysis
    expected_metadata_keys:
    - python_script_id
    - code
    assertions:
    - type: ml_metrics_present
      metrics:
      - MAE
  - turn_id: 5
    user_query: Show order revenue over time and order status breakdown.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    - run_ml_analysis
    expected_metadata_keys:
    - chart_id
    - python_script_id
    assertions:
    - type: chart_generated
    - type: charts_count_minimum
      count: 2
- id: db_mutations
  title: DB Mutations & Rollback
  description: Category insertion, ambiguous order deletion guardrail, selection via
    table inspection, targeted deletion, and rollback.
  turns:
  - turn_id: 1
    user_query: Add a new category 'Smart Electronics'.
    expected_route: tools
    expected_tools:
    - modify_database_table
    expected_metadata_keys:
    - change_id
    - table_name
    assertions:
    - type: mutation_recorded
  - turn_id: 2
    user_query: Find 'Smart Electronics' in categories.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    expected_metadata_keys:
    - sql_query
    assertions:
    - type: record_found
      text: Smart Electronics
  - turn_id: 3
    user_query: Delete some unnecessary orders.
    expected_route: clarification
    expected_tools:
    - modify_database_table
    expected_metadata_keys:
    - status
    - questions
    assertions:
    - type: clarification_requested
  - turn_id: 4
    user_query: Show 3 random cancelled orders with their order_id.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    expected_metadata_keys:
    - sql_query
    assertions:
    - type: not_empty
    - type: target_table
      name: orders
  - turn_id: 5
    user_query: Remove these 3 orders.
    expected_route: tools
    expected_tools:
    - modify_database_table
    expected_metadata_keys:
    - change_id
    - table_name
    assertions:
    - type: mutation_recorded
  - turn_id: 6
    user_query: Rollback the last change.
    expected_route: tools
    expected_tools:
    - rollback_database_change
    expected_metadata_keys:
    - reverted_change_id
    - table_name
    assertions:
    - type: rollback_successful
  - turn_id: 7
    user_query: Verify if these orders were restored.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    expected_metadata_keys:
    - sql_query
    assertions:
    - type: not_empty
- id: robustness
  title: Robustness & Isolation
  description: Missing column handling, graceful conversational follow-up, and session
    replica isolation.
  turns:
  - turn_id: 1
    user_query: Find users where age is 25.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    expected_metadata_keys:
    - schema_mismatch
    assertions:
    - type: not_empty
    - type: forbidden_phrases
      phrases:
      - created_at is not null
      - '9050'
      - 9,050
  - turn_id: 2
    user_query: Is there 'Smart Electronics' in categories?
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    expected_metadata_keys:
    - sql_query
    assertions:
    - type: not_empty
- id: data_ingestion
  title: Data Ingestion
  description: Tabular CSV and Excel (.xlsx) dataset upload, multi-sheet partitioning,
    analytical queries, and error guardrails.
  turns:
  - turn_id: 1
    action: upload
    file_path: tests/fixtures/inventory_items.csv
    user_query: Show 3 products with highest prices from this file.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    expected_metadata_keys:
    - table_names
    - sql_query
    assertions:
    - type: upload_success
      table: inventory_items
    - type: not_empty
    - type: target_table
      name: inventory_items
    - type: forbidden_phrases
      phrases:
      - 📁 **File successfully uploaded
  - turn_id: 2
    user_query: Visualize stock count for these products.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    - run_ml_analysis
    expected_metadata_keys:
    - chart_id
    - python_script_id
    assertions:
    - type: chart_generated
  - turn_id: 3
    action: upload
    file_path: tests/fixtures/simple_catalog.xlsx
    user_query: List available items from this file.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    expected_metadata_keys:
    - table_names
    - sql_query
    assertions:
    - type: upload_success
      table: simple_catalog_items
    - type: not_empty
    - type: forbidden_phrases
      phrases:
      - could not be processed
      - unable to locate
      - could not locate
      - does not exist
  - turn_id: 4
    action: upload
    file_path: tests/fixtures/multi_sheet_data.xlsx
    user_query: Show sales reps who achieved their quota.
    expected_route: tools
    expected_tools:
    - query_and_analyze_database
    expected_metadata_keys:
    - table_names
    - sql_query
    assertions:
    - type: upload_success
      table: multi_sheet_data_sales
    - type: not_empty
    - type: forbidden_phrases
      phrases:
      - could not be processed
      - unable to locate
      - could not locate
      - does not exist
  - turn_id: 5
    action: upload
    file_path: tests/fixtures/corrupted.xlsx
    user_query: Load this file and show products.
    expected_status: error
    assertions:
    - type: upload_error_contains
      text: corrupted
  - turn_id: 6
    action: upload
    file_path: tests/fixtures/empty.csv
    user_query: Load this file.
    expected_status: error
    assertions:
    - type: upload_error_contains
      text: empty
  - turn_id: 7
    action: upload
    file_path: tests/fixtures/unsupported.txt
    user_query: Load this file.
    expected_status: error
    assertions:
    - type: upload_error_contains
      text: unsupported
